<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1f2e" />
    <meta name="description" content="Qualified-coin snapshot dashboard (read-only JSON)." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Qualified coins</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h1>Qualified coins</h1>
    <p class="toolbar">
      <label>
        Snapshot JSON URL
        <input id="apiInput" type="url" placeholder="https://…/qualified_public_snapshot.json" />
      </label>
      <button id="loadBtn" type="button">Load</button>
      <button id="notifyBtn" type="button" class="secondary">Enable update alerts</button>
    </p>
    <p class="toolbar filters">
      <label>
        Search
        <input id="searchInput" type="search" placeholder="Symbol or name" autocomplete="off" />
      </label>
      <span class="chip-group">
        <span class="chip-label">Health ≥</span>
        <button type="button" class="chip chip-filter is-active" data-min="">All</button>
        <button type="button" class="chip chip-filter" data-min="60">60</button>
        <button type="button" class="chip chip-filter" data-min="70">70</button>
      </span>
    </p>
    <div id="error" class="error" hidden></div>
    <p id="meta" class="meta"></p>
    <div id="diffBanner" class="diff-banner" role="status" hidden></div>
    <table>
      <thead>
        <tr>
          <th><button type="button" class="sort-btn" data-sort="symbol">Symbol</button></th>
          <th><button type="button" class="sort-btn" data-sort="name">Name</button></th>
          <th><button type="button" class="sort-btn" data-sort="g30">30d</button></th>
          <th><button type="button" class="sort-btn" data-sort="uniformity">Uniformity</button></th>
          <th><button type="button" class="sort-btn" data-sort="health">Health</button></th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <!-- Optional: <script src="./config.js"></script> for Pages builds -->
    <!-- For GitHub Pages: add <script src="./config.js"></script> before app.js (see config.example.js). -->
    <script src="./app.js"></script>
  </body>
</html>
