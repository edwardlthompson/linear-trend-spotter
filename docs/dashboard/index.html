<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafc" id="themeColorMeta" />
    <meta name="description" content="Qualified-coin snapshot dashboard (read-only JSON)." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Qualified coins</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <h1>Qualified coins</h1>
    <p class="toolbar">
      <label>
        Snapshot JSON URL
        <input id="apiInput" type="url" placeholder="https://…/qualified_public_snapshot.json" />
      </label>
      <button id="loadBtn" type="button">Load</button>
      <label class="poll-toolbar">
        Alert poll
        <select id="pollIntervalSelect" title="Tier-A: how often to re-fetch the snapshot and compare (1h–1D, TradingView-style)"></select>
      </label>
      <button id="notifyBtn" type="button" class="secondary">Enable update alerts</button>
      <button id="pushTierBBtn" type="button" class="secondary" hidden title="Off-device Web Push after each scan (Q21)">
        Remote scan push…
      </button>
      <button id="themeCycleBtn" type="button" class="secondary" title="Cycle theme: system, light, dark">
        Theme: system
      </button>
      <button id="exportCsvBtn" type="button" class="secondary" title="Download current filtered table as CSV">
        Export CSV
      </button>
      <button id="exportJsonBtn" type="button" class="secondary" title="Download current filtered rows as JSON">
        Export JSON
      </button>
    </p>
    <p class="toolbar filters">
      <label>
        Search
        <input id="searchInput" type="search" placeholder="Symbol or name" autocomplete="off" />
      </label>
      <label>
        Exchange
        <select id="exchangeFilter" title="Show coins listed on this exchange (snapshot field listed_on)">
          <option value="">All exchanges</option>
        </select>
      </label>
      <span class="chip-group">
        <span class="chip-label">Health ≥</span>
        <button type="button" class="chip chip-filter is-active" data-min="">All</button>
        <button type="button" class="chip chip-filter" data-min="60">60</button>
        <button type="button" class="chip chip-filter" data-min="70">70</button>
      </span>
    </p>
    <div id="error" class="error" hidden></div>
    <p id="meta" class="meta"></p>
    <div id="staleBanner" class="stale-banner" role="status" hidden></div>
    <div id="healthStrip" class="health-strip" role="status" hidden></div>
    <div id="diffBanner" class="diff-banner" role="status" hidden></div>
    <div class="table-scroll">
    <table>
      <caption class="visually-hidden">
        Qualified coins from the scanner snapshot. Sort with column header buttons; expand a row for
        backtest JSON. To focus a coin, add a hash like #symbol=BTC (or ?symbol=BTC) to the page URL.
      </caption>
      <thead>
        <tr>
          <th scope="col" id="col-symbol">
            <button type="button" class="sort-btn" data-sort="symbol" aria-label="Sort by symbol">
              Symbol
            </button>
          </th>
          <th scope="col" id="col-name">
            <button type="button" class="sort-btn" data-sort="name" aria-label="Sort by name">Name</button>
          </th>
          <th scope="col" id="col-g7">
            <button type="button" class="sort-btn" data-sort="g7" aria-label="Sort by 7-day gain">
              7d
            </button>
          </th>
          <th scope="col" id="col-g30">
            <button type="button" class="sort-btn" data-sort="g30" aria-label="Sort by 30-day gain">
              30d
            </button>
          </th>
          <th scope="col" id="col-uniformity">
            <button type="button" class="sort-btn" data-sort="uniformity" aria-label="Sort by uniformity">
              Uniformity
            </button>
          </th>
          <th scope="col" id="col-health">
            <button type="button" class="sort-btn" data-sort="health" aria-label="Sort by health score">
              Health
            </button>
          </th>
          <th scope="col" id="col-volaccel">
            <button type="button" class="sort-btn" data-sort="volaccel" aria-label="Sort by volume acceleration">
              Vol Δ%
            </button>
          </th>
          <th scope="col" id="col-exch">Volume / exchanges</th>
          <th scope="col" id="col-link">Link</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    </div>

    <dialog id="backtestModal" class="bt-modal">
      <div class="bt-modal-box">
        <header class="bt-modal-head">
          <h2 id="backtestModalTitle" class="bt-modal-title">Backtest detail</h2>
          <button type="button" class="bt-modal-close" id="backtestModalClose" aria-label="Close">
            ×
          </button>
        </header>
        <div id="backtestModalBody" class="bt-modal-body"></div>
      </div>
    </dialog>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
