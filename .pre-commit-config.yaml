# Milestone M2 — run locally: uv sync --extra dev && pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        entry: bash -c 'for f in "$@"; do sed -i "s/[[:space:]]*$//" "$f"; done' --
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: Ensure files end with newline
        entry: bash -c 'for f in "$@"; do [ -n "$(tail -c1 "$f" 2>/dev/null)" ] && echo >> "$f" || true; done' --
        language: system
        types: [text]
      - id: check-yaml
        name: Check YAML syntax
        entry: python -c "import sys,yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]"
        language: system
        types: [yaml]
      - id: check-json
        name: Check JSON syntax
        entry: python -c "import sys,json; [json.load(open(f)) for f in sys.argv[1:]]"
        language: system
        types: [json]
      - id: check-added-large-files
        name: Check for large files
        entry: bash -c 'for f in "$@"; do sz=$(wc -c < "$f"); [ "$sz" -le 512000 ] || { echo "Large file: $f ($sz bytes)"; exit 1; }; done' --
        language: system
        types: [file]
      - id: file-encoding
        name: Check UTF-8 file encoding
        entry: bash scripts/check-file-encoding.sh
        language: system
        pass_filenames: true
        files: (\.(md|json|yml|yaml|sh|ps1|mdc|ts|tsx|toml|html|css|properties|py|js)$|^\.gitignore$)
      - id: workflow-action-refs
        name: Check workflow action ref format
        entry: bash scripts/check-workflow-action-ref-format.sh
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        entry: uv run ruff check
        language: system
        types: [python]
