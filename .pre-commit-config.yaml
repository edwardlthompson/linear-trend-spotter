# Milestone M2 — run locally: uv sync --locked --extra dev && uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: local
    hooks:
      - id: file-encoding
        name: Check UTF-8 file encoding
        entry: bash scripts/check-file-encoding.sh
        language: system
        pass_filenames: true
        files: (\.(md|json|yml|yaml|sh|ps1|mdc|ts|tsx|toml|html|css|properties|py|js)$|^\.gitignore$)
      - id: workflow-action-refs
        name: Check workflow action ref format
        entry: bash scripts/check-workflow-action-ref-format.sh
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        entry: uv run ruff check
        language: system
        types: [python]
