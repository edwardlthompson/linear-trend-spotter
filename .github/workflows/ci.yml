name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Use Node 24 for JavaScript-based actions (checkout/setup-python) per GitHub deprecation timeline.
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # TA-Lib: sdist-only + native lib — skipped in CI (see requirements-ci.txt). Production uses requirements.txt.
      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements-ci.txt
          python -m pip install "ruff>=0.8.0,<0.13"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Backtest environment smoke test
        run: python scripts/verify_backtest_env.py

      - name: Compile all Python sources
        run: python -m compileall -q .
