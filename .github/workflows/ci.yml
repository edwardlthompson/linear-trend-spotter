name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Use Node 24 for JavaScript-based actions (checkout/setup-python) per GitHub deprecation timeline.
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    # Pin 22.04: TA-Lib PyPI ships sdist-only; libta-lib0-dev is in universe and is reliable on jammy.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # apt exits 100 on fatal errors (e.g. missing package). Ensure universe + build tools for TA-Lib sdist.
      - name: Install TA-Lib native library
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y software-properties-common
          sudo apt-add-repository -y universe || true
          sudo apt-get update -y
          sudo apt-get install -y libta-lib0-dev build-essential

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Ruff lint
        run: python -m ruff check .

      - name: Backtest environment smoke test
        run: python scripts/verify_backtest_env.py

      - name: Compile all Python sources
        run: python -m compileall -q .
