name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Use Node 24 for JavaScript-based actions (checkout/setup-python) per GitHub deprecation timeline.
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # TA-Lib: sdist-only + native lib — skipped in CI (see requirements-ci.txt). Render build uses the same script.
      - name: Install, lint, and verify (shared with Render)
        run: bash scripts/ci_verify.sh
