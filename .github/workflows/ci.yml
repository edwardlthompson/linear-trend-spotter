name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install, lint, and verify (shared with Render)
        run: bash scripts/ci_verify.sh

      - name: License compliance (Python)
        run: bash scripts/check-license-compliance.sh

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  encoding-check:
    name: File Encoding (UTF-8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check text files are UTF-8
        run: bash scripts/check-file-encoding.sh

  file-limits:
    name: File Size Budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check file line limits
        run: bash scripts/check-file-limits.sh

  validate-index:
    name: Validate Template Index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate TEMPLATE_INDEX.json paths
        run: bash scripts/validate-template-index.sh

  workflow-actions:
    name: Validate Workflow Action Refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify action tags and SHAs resolve on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/validate-workflow-actions.sh

  validate-bootstrap:
    name: Validate Bootstrap Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Check bootstrap artifacts exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/validate-bootstrap.sh

  template-update-check:
    name: Template Update Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Check for upstream template updates
        run: bash scripts/check-template-updates.sh --verbose
