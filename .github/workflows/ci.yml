name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Use Node 24 for JavaScript-based actions (checkout/setup-python) per GitHub deprecation timeline.
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # TA-Lib on PyPI is sdist-only and needs the C library + headers; apt on runners often exits 100
      # (fatal) depending on image/mirrors. Production (e.g. Render) still installs full requirements.txt.
      # verify_backtest_env.py treats missing TA-Lib as WARN and still validates pandas/numpy/vectorbt.
      - name: Install dependencies (CI skips TA-Lib)
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip wheel
          grep -v -E '^[[:space:]]*TA-Lib' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt
          python -m pip install ruff

      - name: Ruff lint
        run: python -m ruff check .

      - name: Backtest environment smoke test
        run: python scripts/verify_backtest_env.py

      - name: Compile all Python sources
        run: python -m compileall -q .
