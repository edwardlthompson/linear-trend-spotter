name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify required CI workflows green on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-github-ci.sh "$(git rev-parse main)"

      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match pyproject.toml version ($VERSION)"
            exit 1
          fi

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.20.6
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Generate Winget manifest stub
        run: |
          mkdir -p packaging/winget
          cat > packaging/winget/README.md << 'EOF'
          # Winget Manifest Stub

          Generate package manifests here when building native desktop binaries.
          See https://github.com/microsoft/winget-pkgs for submission guidelines.
          EOF

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.2.0
        with:
          subject-path: sbom.cyclonedx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3.3.0.3.3.0.3
        with:
          generate_release_notes: true
          files: |
            packaging/winget/README.md
            sbom.cyclonedx.json
