[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linear-trend-spotter"
version = "0.0.0"
description = "Linear Trend Spotter scanner worker and backtesting helpers (Milestone P4 packaging stub)."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "scripts*", "docs*", ".venv*", "venv*", "build*", "dist*"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["."]

exclude = [
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
# Narrow rule set for CI without mass reformat; expand (e.g. I, E4) incrementally.
select = ["E9", "F"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402", "F401"]
"benchmark_40_tuned.py" = ["E402"]
