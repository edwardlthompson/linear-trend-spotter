[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linear-trend-spotter"
version = "0.0.0"
description = "Linear Trend Spotter scanner worker and backtesting helpers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0,<3",
  "portalocker>=2.0.0,<4",
  "python-dotenv>=1.0.0,<2",
  "pandas>=2.0.0,<4",
  "numpy>=1.24.0,<3",
  "vectorbt>=0.26.0,<2",
  "tabulate>=0.9.0,<1",
  "matplotlib>=3.7.0,<4",
  "psutil>=5.9.0,<8",
]

[project.optional-dependencies]
talib = ["TA-Lib>=0.4.28,<1"]
dev = [
  "pytest>=9.0.3,<10",
  "mypy>=1.8.0,<3",
  "ruff>=0.8.0,<0.16",
  "types-requests>=2.31.0,<3",
  "flask>=3.0.0,<4",
  "pywebpush>=2.0.0,<3",
  "pip-licenses>=4.5.0,<6",
]
push = [
  "flask>=3.0.0,<4",
  "gunicorn>=22.0.0,<27",
  "pywebpush>=2.0.0,<3",
]
snapshot = [
  "flask>=3.0.0,<4",
  "gunicorn>=22.0.0,<27",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "scripts*", "docs*", "push_server*", "snapshot_server*", ".venv*", "venv*", "build*", "dist*"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["."]

exclude = [
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402", "F401"]
"benchmark_40_tuned.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
