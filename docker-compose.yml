# Local smoke / CI parity (Milestone M3). Not used by Render.
services:
  app:
    image: docker.io/library/python:3.11-bookworm
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      PYTHON_VERSION: "3.11"
      DATA_DIR: /tmp/lts-data
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      CMC_API_KEY: ""
      POLYGON_API_KEY: ""
      CHART_IMG_API_KEY: ""
    command: >
      bash -lc "curl -LsSf https://astral.sh/uv/install.sh | sh &&
      export PATH=\"$$HOME/.local/bin:$$PATH\" &&
      bash scripts/ci_verify.sh"
