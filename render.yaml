services:
  - type: worker
    name: linear-trend-spotter-worker
    runtime: python
    plan: starter
    autoDeployTrigger: commit
    # Match GitHub CI: uv sync --extra dev via ci_verify.sh (no TA-Lib sdist).
    buildCommand: bash scripts/ci_verify.sh
    startCommand: bash scripts/render_uv_run.sh bash scripts/run_render_worker.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATA_DIR
        value: /var/data
      - key: SCAN_INTERVAL_SECONDS
        value: "3600"
      - key: CMC_API_KEY
        sync: false
      - key: COINCAP_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: COINAPI_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: CHART_IMG_API_KEY
        sync: false
      - key: WEB_PUSH_NOTIFY_URL
        sync: false
      - key: WEB_PUSH_INTERNAL_SECRET
        sync: false
      - key: WEB_PUSH_DASHBOARD_URL
        sync: false
      - key: QUALIFIED_SNAPSHOT_RELAY_URL
        sync: false
      - key: QUALIFIED_SNAPSHOT_RELAY_SECRET
        sync: false
      - key: NTFY_ENABLED
        sync: false
      - key: NTFY_BASE_URL
        sync: false
      - key: NTFY_TOPIC
        sync: false
      - key: NTFY_TOKEN
        sync: false
      - key: NTFY_DASHBOARD_URL
        sync: false
    disk:
      name: app-data
      mountPath: /var/data
      sizeGB: 10

  # Tier-B Web Push relay (Q21): deploy once, set VAPID_* and WEB_PUSH_INTERNAL_SECRET in dashboard.
  # Q23a: persistent disk so push subscriptions survive redeploys (requires Starter+ for disk mount).
  - type: web
    name: linear-trend-spotter-push
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: commit
    rootDir: push_server
    buildCommand: bash -c 'curl -LsSf https://astral.sh/uv/install.sh | sh && export PATH="$HOME/.local/bin:$PATH" && uv sync --locked --extra push --project ..'
    startCommand: bash -c 'bash ../scripts/render_uv_run.sh --project .. gunicorn --chdir push_server --bind 0.0.0.0:$PORT app:app'
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PUSH_SUBSCRIPTIONS_FILE
        value: /var/data/push_subscriptions.json
      - key: WEB_PUSH_CORS_ORIGINS
        value: "*"
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CONTACT_EMAIL
        sync: false
      - key: WEB_PUSH_INTERNAL_SECRET
        sync: false
      - key: WEB_PUSH_SUBSCRIBE_TOKEN
        sync: false
    disk:
      name: push-data
      mountPath: /var/data
      sizeGB: 1

  # Public qualified snapshot (Q4): GitHub Pages dashboard GETs JSON here with CORS.
  # Worker POSTs after each scan (QUALIFIED_SNAPSHOT_RELAY_*). Workers do not serve HTTP.
  # NOTE: Default store is under /tmp — file disappears on redeploy/restart until the worker
  # POSTs again. For persistence, add a small persistent disk (Starter+) and set
  # SNAPSHOT_RELAY_STORE to a path on that volume.
  - type: web
    name: linear-trend-spotter-snapshot
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    rootDir: snapshot_server
    buildCommand: bash -c 'curl -LsSf https://astral.sh/uv/install.sh | sh && export PATH="$HOME/.local/bin:$PATH" && uv sync --locked --extra snapshot --project ..'
    startCommand: bash -c 'bash ../scripts/render_uv_run.sh --project .. gunicorn --chdir snapshot_server --bind 0.0.0.0:$PORT app:app'
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SNAPSHOT_RELAY_CORS_ORIGINS
        value: "*"
      - key: SNAPSHOT_RELAY_STORE
        value: /tmp/qualified_public_snapshot.json
      - key: QUALIFIED_SNAPSHOT_RELAY_SECRET
        sync: false
